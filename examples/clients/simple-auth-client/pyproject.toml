[project]
name = "darpy-sdk-simple-auth-client"
version = "0.1.0"
description = "A simple OAuth client for the MCP simple-auth server"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Model Context Protocol a Series of LF Projects, LLC." }]
keywords = ["mcp", "oauth", "client", "auth"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["click>=8.2.0", "darpy-sdk"]

[project.scripts]
darpy-sdk-simple-auth-client = "darpy_sdk_simple_auth_client.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darpy_sdk_simple_auth_client"]

[tool.pyright]
pythonVersion = "3.14"
include = ["darpy_sdk_simple_auth_client"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 120
target-version = "py314"

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8.3.3", "ruff>=0.14.0"]
