[project]
name = "darpy-sdk-types"
version = "0.1.0"
description = "Darbot Python SDK protocol wire types"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "DarbotLabs" }]
maintainers = [{ name = "DarbotLabs" }]
keywords = ["darpy", "mcp", "acp", "agents", "automation"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.12.0",
    "typing-extensions>=4.13.0",
]

[project.urls]
Homepage = "https://github.com/DarbotLM/darpy-sdk"
Documentation = "https://github.com/DarbotLM/darpy-sdk/tree/main/docs"
Repository = "https://github.com/DarbotLM/darpy-sdk"
Issues = "https://github.com/DarbotLM/darpy-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darpy_sdk_types"]
