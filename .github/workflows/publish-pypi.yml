name: Publishing

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Build distribution
    if: github.repository == 'DarbotLM/darpy-sdk'
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: 0.12.5

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Verify Darbot package identities and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --frozen --no-project --python 3.14 python - <<'PY'
          import os
          import pathlib
          import tomllib

          root = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          types = tomllib.loads(pathlib.Path("src/darpy-sdk-types/pyproject.toml").read_text(encoding="utf-8"))["project"]
          assert root["name"] == "darpy-sdk", root["name"]
          assert types["name"] == "darpy-sdk-types", types["name"]
          assert root["version"] == types["version"], "SDK and types versions must match"
          assert os.environ["RELEASE_TAG"] == f"v{root['version']}", "Release tag must match the static version"
          PY

      - name: Build
        run: |
          uv build --frozen --package darpy-sdk
          uv build --frozen --package darpy-sdk-types

      - name: Verify release artifact names
        run: |
          uv run --frozen --no-project --python 3.14 python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = {
              f"{name}-{version}{suffix}"
              for name in ("darpy_sdk", "darpy_sdk_types")
              for suffix in (".tar.gz", "-py3-none-any.whl")
          }
          actual = {path.name for path in pathlib.Path("dist").iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/

  checks:
    uses: ./.github/workflows/shared.yml

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: release
    needs:
      - release-build
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Lets a re-run after a partially failed upload publish the remaining
          # files instead of erroring on the ones already on PyPI.
          skip-existing: true
